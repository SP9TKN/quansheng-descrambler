[package]
name = "quansheng-descrambler"
version = "0.1.0"
edition = "2024"

[dependencies]
cpal = "0.18.2"
eframe = "0.37.0"
hound = "3.5.1"
rfd = "0.17.2"
rustfft = "6.4.1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "flac", "ogg", "vorbis"] }

[[bin]]
name = "decoder_scrambler_pogsag"
path = "src/main.rs"

[profile.release]
strip = true
